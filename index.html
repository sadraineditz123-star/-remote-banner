
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcement Banner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #101010;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    
}

.popup {
    width: 340px;
    background: #080808;
    border: 1px solid #c9a227;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 0 20px rgba(201,162,39,0.12);
    
}

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
}

.logo {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 2px solid #c9a227;
    object-fit: cover;
}

.title {
    color: #e4bd50;
    font-size: 19px;
    font-weight: bold;
}

.welcome-box {
    border: 1px solid #c9a227;
    border-radius: 15px;
    padding: 14px;
    background: #111111;
    line-height: 2.6;
    
}

.welcome-title {
    text-align: center;
    color: #e4bd50;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.message {
    color: #eeeeee;
    font-size: 14px;
    white-space: pre-line;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 16px;
}

button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #c9a227;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.close {
    background: #151515;
    color: #e4bd50;
}

.join {
    background: #d4a928;
    color: #000;
}
</style>
</head>

<body>

<div class="popup">

    <div class="header">
        <img class="logo"
             src="https://placehold.co/100x100/111111/D4AF37?text=LOGO"
             alt="Profile Logo">

        <div class="title">
            TG : @YourName
        </div>
    </div>

    <div class="welcome-box">
        <div class="welcome-title">
            ✨ Hello & Welcome ✨
        </div>

        <div class="message">
Welcome to our community!

Here you can add your announcement, information, and updates.
        </div>
    </div>

    <div class="buttons">
        <button class="close" onclick="closeBanner()">Close</button>
        <button class="join" onclick="joinCommunity()">Join Now</button>
    </div>

</div>

<script>
function closeBanner() {
    document.querySelector(".popup").style.display = "none";
}

function joinCommunity() {
    alert("Add your community link here.");
}
</script>

</body>
</html>
